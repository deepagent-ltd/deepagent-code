name: beta

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  sync:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        # W0.5: the V2 owner authorization is minted by publish.yml (a REAL signing job) from the
        # release build identity and exported as owner-authorization.json; this cron sync job must
        # never depend on the signing secret — a missing secret would otherwise block the beta sync.

      - name: Setup Git Committer
        id: setup-git-committer
        uses: ./.github/actions/setup-git-committer
        with:
          deepagent-code-app-id: ${{ vars.DEEPAGENT_CODE_APP_ID }}
          deepagent-code-app-secret: ${{ secrets.DEEPAGENT_CODE_APP_SECRET }}

      - name: Install DeepAgent Code
        run: bun i -g deepagent-code

      - name: Sync beta branch
        env:
          GH_TOKEN: ${{ steps.setup-git-committer.outputs.token }}
          DEEPAGENT_CODE_API_KEY: ${{ secrets.DEEPAGENT_CODE_API_KEY }}
        run: bun script/beta.ts
