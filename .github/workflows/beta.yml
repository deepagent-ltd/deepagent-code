name: beta

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  sync:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Mint V2 owner authorization (v2.0 design W0.3)
        working-directory: packages/deepagent-code
        env:
          # The campaign issuer's Ed25519 private key (PEM inline, or a path to a PEM file — the
          # same convention as script/v2-campaign-sign.ts). NOTE: no
          # `DEEPAGENT_CODE_OWNER_SIGNING_KEY` secret is configured in this repository yet. Until
          # it is added the step fails closed (exit 1) — release minting must never write an
          # unsigned row. Create the secret before this workflow can mint.
          DEEPAGENT_CODE_OWNER_SIGNING_KEY: ${{ secrets.DEEPAGENT_CODE_OWNER_SIGNING_KEY }}
        run: |
          bun install
          bun script/mint-owner-campaign.ts --build-identity "$(git describe --tags)"

      - name: Setup Git Committer
        id: setup-git-committer
        uses: ./.github/actions/setup-git-committer
        with:
          deepagent-code-app-id: ${{ vars.DEEPAGENT_CODE_APP_ID }}
          deepagent-code-app-secret: ${{ secrets.DEEPAGENT_CODE_APP_SECRET }}

      - name: Install DeepAgent Code
        run: bun i -g deepagent-code

      - name: Sync beta branch
        env:
          GH_TOKEN: ${{ steps.setup-git-committer.outputs.token }}
          DEEPAGENT_CODE_API_KEY: ${{ secrets.DEEPAGENT_CODE_API_KEY }}
        run: bun script/beta.ts
