name: generate

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Generate
        run: ./script/generate.ts

      - name: Verify committed generated sources
        run: |
          git diff --check -- packages/sdk/js/src/gen packages/sdk/openapi.json
          if [ -n "$(git status --porcelain -- packages/sdk/js/src/gen packages/sdk/openapi.json)" ]; then
            git diff --stat -- packages/sdk/js/src/gen packages/sdk/openapi.json
            echo "Generated SDK/OpenAPI sources differ. Run ./script/generate.ts locally and submit the reviewed generated files through the normal branch/PR flow." >&2
            exit 1
          fi
          echo "Committed SDK/OpenAPI sources are current"
