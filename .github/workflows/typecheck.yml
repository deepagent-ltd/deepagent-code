name: typecheck

on:
  push:
    branches: [dev]
  # Gate every PR regardless of target branch: the typecheck baseline is easily polluted by stale
  # worktrees/generated files, so keep it required and branch-agnostic.
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    # W-01 §2.2.6: typecheck the Windows surface too — the win32 branches added
    # by the native Windows work (shell dialect layer, data-directory split,
    # registry env import, DPAPI, NSIS) must stay type-clean on the OS they
    # target, and path/name casing errors only surface on a case-preserving
    # filesystem.
    name: typecheck (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-24.04
          - name: windows
            host: windows-2025
    runs-on: ${{ matrix.settings.host }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck
