name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: Unit platform for a manual diagnostic run; main pushes test every platform
        type: choice
        default: all
        options: [all, linux, windows, macos]
      suite:
        description: Unit suite for a manual diagnostic run; main pushes test every suite
        type: choice
        default: all
        options: [all, common, core, cli, desktop, app]
      shard:
        description: Unit shard (common 1, core 1-4, cli 1-8); main pushes test every shard
        type: choice
        default: all
        options: [all, "1", "2", "3", "4", "5", "6", "7", "8"]
      test_file:
        description: Package-relative file for a manual diagnostic; desktop and app require a file; main pushes run every file
        type: string
        default: ""
      test_name:
        description: Optional Bun case-name pattern within a manual core, cli or desktop file; main pushes run every case
        type: string
        default: ""
      project_runtime:
        description: Use the packageManager runtime for a focused manual Linux CLI test file
        type: boolean
        default: false

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}-${{ github.event_name }}-${{ inputs.platform || 'all' }}-${{ inputs.suite || 'all' }}-${{ inputs.shard || 'all' }}-${{ inputs.test_file || 'all-files' }}-${{ inputs.test_name || 'all-cases' }}-${{ inputs.project_runtime && 'project-runtime' || 'test-runtime' }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  public-source-boundary:
    name: public-source-boundary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Validate the manual unit selection
        if: github.event_name == 'workflow_dispatch'
        run: |
          bun -e 'const suite=process.env.DAC_UNIT_SUITE; const shard=process.env.DAC_UNIT_SHARD; const file=process.env.DAC_UNIT_TEST_FILE; if (shard !== "all" && (!/^[1-8]$/.test(shard ?? "") || Number(shard) > (suite === "common" ? 1 : suite === "core" ? 4 : suite === "cli" ? 8 : 0))) throw new Error("Select a specific suite and one of its valid shards, or choose all shards"); if (["desktop","app"].includes(suite ?? "") && !file) throw new Error("A desktop or app diagnostic requires a test file"); if (file && (!["core","cli","desktop","app"].includes(suite ?? "") || shard !== "all" || !/^(?:test|src)\/(?:[A-Za-z0-9_.-]+\/)*[A-Za-z0-9_.-]+\.test\.tsx?$/.test(file) || !file.startsWith(suite === "desktop" ? "src/" : suite === "app" ? "test/components/" : "test/") || file.split("/").includes(".."))) throw new Error("A file diagnostic requires core, cli, desktop or app, all shards, and a package-relative test file")'
          bun -e 'const name=process.env.DAC_UNIT_TEST_NAME; if (name && (!process.env.DAC_UNIT_TEST_FILE || process.env.DAC_UNIT_SHARD !== "all" || !["core","cli","desktop"].includes(process.env.DAC_UNIT_SUITE ?? "") || name.length > 256 || /[\x00-\x1f\x7f]/.test(name))) throw new Error("A Bun case diagnostic requires a file, all shards, and a bounded case pattern"); if (name) new RegExp(name)'
          if [[ "$DAC_UNIT_PROJECT_RUNTIME" == 'true' ]]; then
            test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
            test "$DAC_UNIT_PLATFORM" = 'linux'
            test "$DAC_UNIT_SUITE" = 'cli'
            test -n "$DAC_UNIT_TEST_FILE"
            git ls-files --error-unmatch "packages/deepagent-code/$DAC_UNIT_TEST_FILE"
          fi
        env:
          DAC_UNIT_PLATFORM: ${{ inputs.platform || 'all' }}
          DAC_UNIT_PROJECT_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.project_runtime && 'true' || 'false' }}
          DAC_UNIT_SUITE: ${{ inputs.suite || 'all' }}
          DAC_UNIT_SHARD: ${{ inputs.shard || 'all' }}
          DAC_UNIT_TEST_FILE: ${{ inputs.test_file || '' }}
          DAC_UNIT_TEST_NAME: ${{ inputs.test_name || '' }}

      - name: Verify public documents and complete history
        run: bun script/check-public-source-boundary.ts --history

  test-fixture-gate:
    name: test-fixture-gate
    # QUAL-003: forbid test fixtures from bypassing the durable session state
    # machine via direct inserts into authority tables. Pure grep gate, no deps.
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run test fixture gate
        run: bun script/check-test-fixtures.ts

  manifest-digest-gate:
    name: manifest-digest-gate
    # K-05/B-11: the C7-10 deterministic manifest must reproduce from the committed
    # tree on any machine — byte-stable across runs, pinned to head-pin.ts, every
    # digest input git-tracked, and git-ignored .artifacts/ residue unable to
    # perturb the digest. Pure stateless gate, mirrors the test-fixture-gate pattern.
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run manifest digest reproducibility gate
        working-directory: packages/core
        run: bun run manifest:assert-reproducible

  unit:
    name: unit (${{ matrix.settings.name }}, ${{ matrix.suite }}, ${{ matrix.shard }})
    timeout-minutes: ${{ matrix.settings.timeout }}
    strategy:
      fail-fast: false
      matrix:
        settings: >-
          ${{ fromJSON(
            inputs.platform == 'linux' && '[{"name":"linux","host":"ubuntu-24.04","timeout":60}]' ||
            inputs.platform == 'windows' && '[{"name":"windows","host":"windows-2025","timeout":60}]' ||
            inputs.platform == 'macos' && '[{"name":"macos","host":"macos-14","timeout":120}]' ||
            '[{"name":"linux","host":"ubuntu-24.04","timeout":60},{"name":"windows","host":"windows-2025","timeout":60},{"name":"macos","host":"macos-14","timeout":120}]'
          ) }}
        # Fresh isolated databases deliberately exercise the full migration chain.
        # Partition the two large packages by file while running every other package once.
        suite: >-
          ${{ fromJSON(
            inputs.suite == 'common' && '["common"]' ||
            inputs.suite == 'core' && '["core"]' ||
            inputs.suite == 'cli' && '["cli"]' ||
            inputs.suite == 'desktop' && '["desktop"]' ||
            inputs.suite == 'app' && '["app"]' || '["common","core","cli"]'
          ) }}
        shard: ${{ fromJSON(inputs.test_file && '[1]' || inputs.shard && inputs.shard != 'all' && format('[{0}]', inputs.shard) || '[1,2,3,4,5,6,7,8]') }}
        exclude:
          - suite: common
            shard: 2
          - suite: common
            shard: 3
          - suite: common
            shard: 4
          - suite: common
            shard: 5
          - suite: common
            shard: 6
          - suite: common
            shard: 7
          - suite: common
            shard: 8
          - suite: core
            shard: 5
          - suite: core
            shard: 6
          - suite: core
            shard: 7
          - suite: core
            shard: 8
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source bytes on Windows
        if: runner.os == 'Windows'
        # Frozen migration and manifest digests bind the committed LF source bytes.
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@ai.deepagent.ltd"
          git config --global user.name "deepagent-code"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ matrix.suite }}-${{ matrix.shard }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ matrix.suite }}-${{ matrix.shard }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Install locked IM SDK build tools
        run: npm ci --ignore-scripts --prefix packages/im-kernel-sdk/upstream

      - name: Install locked Chromium for component IndexedDB
        working-directory: packages/app
        run: bun x playwright install --only-shell --with-deps chromium

      - name: Prepare test search dependency
        run: |
          if ! bun -e 'process.exit(Bun.which("rg") ? 0 : 1)'; then
            if [[ "$RUNNER_OS" == 'Linux' ]]; then
              sudo apt-get update
              sudo apt-get install --no-install-recommends -y ripgrep
            elif [[ "$RUNNER_OS" == 'macOS' ]]; then
              brew install ripgrep
            else
              choco install ripgrep --yes --no-progress
            fi
          fi
          bun -e 'if (!Bun.which("rg")) throw new Error("ripgrep test executable is unavailable")'
          rg --version

      - name: Prepare Windows archive test dependencies
        if: runner.os == 'Windows'
        run: |
          for dac_archive_command in zip unzip; do
            if ! command -v "$dac_archive_command" >/dev/null; then
              choco install "$dac_archive_command" --yes --no-progress
            fi
          done
          command -v zip
          command -v unzip
          zip -v

      - name: Prepare the locked Linux Electron sandbox
        if: runner.os == 'Linux'
        run: |
          dac_electron_sandbox=$(node -p 'require("node:path").join(require("node:path").dirname(require("./packages/desktop/node_modules/electron")), "chrome-sandbox")')
          test -f "$dac_electron_sandbox"
          sudo chown root:root "$dac_electron_sandbox"
          sudo chmod 4755 "$dac_electron_sandbox"
          test "$(stat -c '%U:%G:%a' "$dac_electron_sandbox")" = 'root:root:4755'
          command -v xvfb-run

      - name: Build the current POSIX file protocol test helper
        if: matrix.suite == 'cli' && runner.os != 'Windows'
        # This test speaks the POSIX dev/inode protocol directly; it does not
        # grant installed Native authority or use the Windows handle protocol.
        run: |
          cargo build --locked --manifest-path packages/work-file-helper/Cargo.toml --bin deepagent-work-file-helper
          dac_work_file_helper="$PWD/packages/work-file-helper/target/debug/deepagent-work-file-helper"
          test -x "$dac_work_file_helper"
          echo "DAC_WORK_FILE_HELPER_BINARY=$dac_work_file_helper" >> "$GITHUB_ENV"

      - name: Prepare the fixed Linux CLI test runtime
        if: runner.os == 'Linux' && matrix.suite == 'cli' && !(github.event_name == 'workflow_dispatch' && inputs.project_runtime)
        timeout-minutes: 10
        # Bun #43856 crashes in NapiEnv teardown after passing --isolate files.
        # Keep installation and dependency builds on the project's Bun 1.4.2.
        run: |
          test "$RUNNER_ARCH" = 'X64'
          test "$(bun --version)" = '1.4.2'
          bun turbo build --filter='deepagent-code^...'
          dac_test_bun_root=$(mktemp -d "$RUNNER_TEMP/dac-linux-cli-bun143-XXXXXX")
          # Official bun-v1.4.3 baseline asset 626789490, source c6da4a4d3010e5553438c60f6bd76d981976867c.
          curl --fail --location --retry 2 --max-time 120 \
            --output "$dac_test_bun_root/bun.zip" \
            'https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/bun-linux-x64-baseline.zip'
          printf '%s  %s\n' '1fc2edac843102909e3a1be1d8d9802cc6071cf074e67e88231f4ffe0f8b397b' \
            "$dac_test_bun_root/bun.zip" | sha256sum --check -
          mkdir "$dac_test_bun_root/bin"
          unzip -q -j "$dac_test_bun_root/bun.zip" '*/bun' -d "$dac_test_bun_root/bin"
          test -x "$dac_test_bun_root/bin/bun"
          test "$("$dac_test_bun_root/bin/bun" --revision)" = '1.4.3+c6da4a4d3'
          test "$("$dac_test_bun_root/bin/bun" -e 'process.stdout.write(Bun.revision)')" = 'c6da4a4d3010e5553438c60f6bd76d981976867c'
          echo "$dac_test_bun_root/bin" >> "$GITHUB_PATH"

      - name: Run unit tests
        timeout-minutes: ${{ matrix.settings.timeout }}
        run: |
          if [[ "$DAC_PROJECT_RUNTIME" == 'true' ]]; then
            test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
            test "$DAC_TEST_PLATFORM" = 'linux'
            test "$RUNNER_OS" = 'Linux'
            test "$DAC_TEST_SUITE" = 'cli'
            test -n "$DAC_TEST_FILE"
            git ls-files --error-unmatch "packages/deepagent-code/$DAC_TEST_FILE"
            test "$(bun --version)" = '1.4.2'
          fi
          if [[ ( "$DAC_TEST_SUITE" == 'desktop' || "$DAC_TEST_SUITE" == 'app' ) && -z "$DAC_TEST_FILE" ]]; then
            echo 'A desktop or app diagnostic requires a test file' >&2
            exit 1
          fi
          if [[ -n "$DAC_TEST_NAME" ]]; then
            bun -e 'const name=process.env.DAC_TEST_NAME; if (!name || !process.env.DAC_TEST_FILE || !["core","cli","desktop"].includes(process.env.DAC_TEST_SUITE ?? "") || name.length > 256 || /[\x00-\x1f\x7f]/.test(name)) throw new Error("Invalid Bun case diagnostic"); new RegExp(name)'
          fi
          if [[ "$DAC_TEST_SUITE" == 'common' ]]; then
            dac_test_command=(bun run test:ci --filter='!@deepagent-code/core' --filter='!deepagent-code' --continue=always --log-order=stream --log-prefix=task)
            # The Windows App and Electron fixtures each need their original cold-start budget.
            # Run every package while keeping their heavy child processes from competing here.
            if [[ "$RUNNER_OS" == 'Windows' ]]; then
              dac_test_command+=(--concurrency=1)
            fi
          else
            if [[ "$DAC_TEST_SUITE" == 'core' ]]; then
              dac_test_directory='packages/core'
            elif [[ "$DAC_TEST_SUITE" == 'desktop' ]]; then
              dac_test_directory='packages/desktop'
            elif [[ "$DAC_TEST_SUITE" == 'app' ]]; then
              bun turbo build --filter='@deepagent-code/app^...'
              dac_test_directory='packages/app'
            else
              if [[ "$RUNNER_OS" != 'Linux' || "$DAC_TEST_SUITE" != 'cli' || "$DAC_PROJECT_RUNTIME" == 'true' ]]; then
                bun turbo build --filter='deepagent-code^...'
              fi
              dac_test_directory='packages/deepagent-code'
            fi
            # Keep shard flags on the package test command, away from dependency compilers.
            dac_test_command=(bun run --cwd "$dac_test_directory" test:ci)
            if [[ -n "$DAC_TEST_FILE" ]]; then
              bun -e 'const file=process.env.DAC_TEST_FILE; const prefix=process.env.DAC_TEST_SUITE === "desktop" ? "src/" : process.env.DAC_TEST_SUITE === "app" ? "test/components/" : "test/"; if (!file || !/^(?:test|src)\/(?:[A-Za-z0-9_.-]+\/)*[A-Za-z0-9_.-]+\.test\.tsx?$/.test(file) || !file.startsWith(prefix) || file.split("/").includes("..")) throw new Error("Invalid diagnostic test file")'
              git ls-files --error-unmatch "$dac_test_directory/$DAC_TEST_FILE"
              if [[ "$DAC_TEST_SUITE" == 'desktop' ]]; then
                # test:ci includes ./src; invoking it would also select every other Desktop test.
                mkdir -p "$dac_test_directory/.artifacts/unit"
                cd "$dac_test_directory"
                dac_test_command=(bun test "./$DAC_TEST_FILE" --reporter=junit --reporter-outfile=.artifacts/unit/junit.xml)
              elif [[ "$DAC_TEST_SUITE" == 'app' ]]; then
                mkdir -p "$dac_test_directory/.artifacts/unit"
                cd "$dac_test_directory"
                dac_test_command=(bun run test:components "./$DAC_TEST_FILE" --reporter=default --reporter=junit --outputFile=.artifacts/unit/junit.xml)
              else
                dac_test_command+=("./$DAC_TEST_FILE")
              fi
            else
              dac_test_command+=("--shard=$DAC_TEST_SHARD/$DAC_TEST_SHARDS")
            fi
          fi
          if [[ -n "$DAC_TEST_NAME" ]]; then
            dac_test_command+=(--test-name-pattern "$DAC_TEST_NAME")
          fi
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            xvfb-run -a --server-args='-screen 0 1920x1080x24' "${dac_test_command[@]}"
          else
            "${dac_test_command[@]}"
          fi
        env:
          DAC_TEST_PLATFORM: ${{ inputs.platform || 'all' }}
          DAC_PROJECT_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.project_runtime && 'true' || 'false' }}
          DAC_TEST_SUITE: ${{ matrix.suite }}
          DAC_TEST_SHARD: ${{ matrix.shard }}
          DAC_TEST_SHARDS: ${{ matrix.suite == 'cli' && 8 || 4 }}
          DAC_TEST_FILE: ${{ inputs.test_file || '' }}
          DAC_TEST_NAME: ${{ inputs.test_name || '' }}
          DEEPAGENT_CODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Run HttpApi exerciser gates
        if: runner.os == 'Linux' && matrix.suite == 'common'
        run: |
          bun turbo build --filter='deepagent-code^...'
          bun run --cwd packages/deepagent-code test:httpapi

      - name: Publish unit reports
        if: always()
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6.4.0
        with:
          report_paths: ${{ matrix.suite == 'core' && 'packages/core/.artifacts/unit/junit.xml' || matrix.suite == 'cli' && 'packages/deepagent-code/.artifacts/unit/junit.xml' || 'packages/**/.artifacts/unit/junit.xml' }}
          check_name: "unit results (${{ matrix.settings.name }}, ${{ matrix.suite }}, ${{ matrix.shard }})"
          detailed_summary: true
          include_time_in_summary: true
          resolve_ignore_classname: true
          fail_on_failure: false

      - name: Upload unit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-${{ matrix.settings.name }}-${{ matrix.suite }}-${{ matrix.shard }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ matrix.suite == 'core' && 'packages/core/.artifacts/unit/junit.xml' || matrix.suite == 'cli' && 'packages/deepagent-code/.artifacts/unit/junit.xml' || 'packages/**/.artifacts/unit/junit.xml' }}

  desktop-smoke:
    name: desktop-smoke (macos)
    if: github.event_name != 'workflow_dispatch' || ((inputs.platform == '' || inputs.platform == 'all') && (inputs.suite == '' || inputs.suite == 'all') && (inputs.shard == '' || inputs.shard == 'all'))
    # The prevent-sleep smoke drives the real packaged main bundle through Playwright and asserts
    # against pmset, so it needs a macOS runner with a window server; keep it out of the unit matrix.
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build desktop main bundle
        working-directory: packages/desktop
        run: bun run build
        timeout-minutes: 15

      - name: Run prevent-sleep smoke
        working-directory: packages/desktop
        run: bun run test:prevent-sleep-smoke
        timeout-minutes: 10

  e2e:
    name: e2e (${{ matrix.settings.name }})
    if: github.event_name != 'workflow_dispatch' || ((inputs.platform == '' || inputs.platform == 'all') && (inputs.suite == '' || inputs.suite == 'all') && (inputs.shard == '' || inputs.shard == 'all'))
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-24.04
          - name: windows
            host: windows-2025
    runs-on: ${{ matrix.settings.host }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
          PLAYWRIGHT_JUNIT_OUTPUT: e2e/junit-${{ matrix.settings.name }}.xml
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/junit-*.xml
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
