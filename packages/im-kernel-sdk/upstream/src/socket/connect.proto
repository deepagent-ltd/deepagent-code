    int64 eventTime = 5;
}
enum RtcRoomEventType{
    DefaultRtcRoomEvent = 0;
    RtcJoin = 1;
    RtcQuit = 2;
    RtcDestroy = 3;
    RtcStateChg = 4;
}

enum RtcRoomQuitReason{
    Active = 0; //主动退出
    CallTimeout = 1;//暂时废弃
    PingTimeout = 2; //ping超时，自动被提出
}
message TransReq{
    repeated TransItem items = 1;
    string targetLang = 2;
    string sourceLang = 3;
}
message TransItem{
    string key = 1;  
    string content = 2;
}
message SetTopMsgReq{
  string targetId = 1;
  ChannelType channelType = 2;
  string msgId = 3;
}
message GetTopMsgReq{
  string targetId = 1;
  ChannelType channelType = 2;
}
message TopMsg{
  DownMsg msg = 1;
  UserInfo operator = 2;
  int64 createdTime = 3;
}
message FavoriteMsgIds{
  repeated FavoriteMsgIdItem items = 1;
}
message FavoriteMsgIdItem{
  string senderId = 1;
  string receiverId = 2;
  ChannelType channelType = 3;
  string msgId = 4;
}
message QryFavoriteMsgsReq{
  int64 limit = 1;
  string offset = 2;
}
message FavoriteMsgs{
  repeated FavoriteMsg items = 1;
  string offset = 2;
}
message FavoriteMsg{
  DownMsg msg = 1;
  int64 createdTime = 2;
}
message RegPushTokenReq{
    string deviceId = 1;
    Platform platform = 2;
    PushChannel pushChannel = 3;
    string pushToken = 4;
    string packageName = 5;
}
enum Platform{
    DefaultPlatform = 0;
    Android = 1;
    iOS = 2;
    Web = 3;
    PC = 4;
}
enum PushChannel{
    DefaultChannel = 0;
    Apple = 1;
    Huawei = 2;
    Xiaomi = 3;
