syntax = "proto3";

package codec;

message ConnectMsgBody{
    string protoId = 1;
    string sdkVersion = 2; //sdk 版本
    string appkey = 3;
    string token = 4;

    //设备信息
    string deviceId = 5;
    string platform = 6;//iOS/Android/iPad
    string deviceCompany = 7;//设备厂商, huawei/apple
    string deviceModel = 8;//设备型号  例如: iPhone8
    string deviceOsVersion = 9;//手机操作系统版本
    string pushToken = 10;//厂商推送Token
    //网络
    string networkId = 11;//网络类型；4G/wifi
    string isp_num = 12;//网络运营商编号
    string clientIp = 13;

    string packageName =14;
    string pushChannel =15;
    string ext = 16;
    string clientSession = 17;
}

message ConnectAckMsgBody{
    int32 code = 1;
    string userId = 2;
    string session = 3;
    int64 timestamp = 4;
    string ext = 5;
    int32 mentionClearType = 8;
}

message DisconnectMsgBody{
    int32 code = 1;
    int64 timestamp = 2;
    string ext = 3;
}

message PublishMsgBody{
    int32 index = 1;
    string topic = 2;
    string targetId = 3;
    int64 timestamp = 4;
    bytes data = 5;
}

message PublishAckMsgBody{
    int32 index = 1;
    int32 code = 2;
    string msgId = 3;
    int64 timestamp = 4;
    int64 msgIndex = 5;
    int32 memberCount = 6;
    string clientMsgId = 7;
    DownMsg modifiedMsg = 8;
    int32 deliveryVersion = 9;
    int64 deliveryExpiresAt = 10;
    string deliveryRequestHash = 11;
}

message QueryMsgBody{
    int32 index = 1;
    string topic = 2;
    string targetId = 3;
    int64 timestamp = 4;
    bytes data = 5;
}

message QueryAckMsgBody{
    int32 index = 1;
    int32 code = 2;
    int64 timestamp = 3;
    bytes data = 4;
}

message QueryConfirmMsgBody{
    int32 index = 1;
}

message ImWebsocketMsg {
    int32 version = 1;
    int32 cmd = 2;
    int32 qos  = 3;
    bytes payload = 4;
    oneof testof{
        ConnectMsgBody connectMsgBody = 11;
        ConnectAckMsgBody ConnectAckMsgBody = 12;
        DisconnectMsgBody disconnectMsgBody = 13;
        PublishMsgBody publishMsgBody = 14;
        PublishAckMsgBody pubAckMsgBody = 15;
        QueryMsgBody qryMsgBody = 16;
        QueryAckMsgBody qryAckMsgBody = 17;
        QueryConfirmMsgBody qryConfirmMsgBody = 18;
    }
}

enum ChannelType {
    Private = 1;  //单聊
    Group = 2;    //群聊
    Chatroom = 3; // 聊天室
    System = 4;   // 系统消息
}

enum PushLevel{
  DefaultPuhsLevel = 0;
  IgnoreSpeedControl = 1;
  IgnoreUndisturb = 2;
}

message PushData{
    string title = 1;
    string pushId = 2;
    string pushText = 3;
    string pushExtraData = 4;
    PushLevel pushLevel = 5;
    bool isVoip = 6;
    string jPushOptions = 7;
}

message QryHisMsgsReq{
    string converId = 1;
    ChannelType type = 2;
    int64 startTime = 3;
    int32 count = 4;
    int32 order = 5;
    repeated string msgTypes = 6;
}

message DownMsgSet{
    repeated DownMsg msgs = 1;
    int64 syncTime = 2;
    bool isFinished = 3;
    UserInfo targetUserInfo = 4;
    GroupInfo groupInfo = 5;
}

message UpMsg {
    string msgType = 1;   //消息类型定义
    bytes msgContent= 2;  // 消息实体数据
    int32 flags = 3;      // 标识 
    string clientUid=4;   //客户端指定的消息唯一ID
    PushData pushData = 5; // 推送设置
    MentionInfo mentionInfo = 6; //@ 消息
    DownMsg referMsg = 7;
    repeated string toUserIds = 8;
    MergedMsgs mergedMsgs = 9;
    string SearchText = 10;
    int64 lifeTime = 11;   // 消息默认生存周期，单位毫秒，例如：86400000，即该消息1天后会被自动删除
    int64 lifeTimeAfterRead = 12; // 消息已读后的生存周期，通常小于lifeTime，例如60000，即消息已读1分钟后会被自动删除
    string subChannel = 13;
    int64 msgTime = 51;
    int64 deliveryExpiresAt = 52;
    int32 deliveryVersion = 53;
}
message MentionInfo {
    MentionType mentionType = 1;
    repeated UserInfo targetUsers = 2;  //被@ 人列表
}
enum MentionType{
    MentionDefault = 0;
    MentionAll = 1;    //@ 所有人
    MentionSomeone = 2; //@ 指定人
}
message DownMsg{
    string targetId = 1;
    ChannelType type = 2;
    string msgType = 3;
    string senderId = 4;
    string msgId = 5;
    // msgIndex 是双方混排的序号！序号！序号！
    int64 msgIndex = 6;
    bytes msgContent = 7;
    int64 msgTime = 8;
    int32 flags = 9;
    bool isSend = 10;
    string platform = 11;
    string clientUid = 12;
    PushData pushData = 13;
    MentionInfo mentionInfo = 14;
    bool isRead = 15;
    DownMsg referMsg = 16;
    UserInfo targetUserInfo = 17;
    GroupInfo groupInfo = 18;
    MergedMsgs mergedMsgs = 19;
    int32 undisturbType = 20;
    int32 memberCount = 21;
    int32 readCount = 22;
    int64 unreadIndex = 23;
    repeated StreamMsgItem msgItems = 24;
    repeated MsgExtItem msgExtSet = 25;
    repeated MsgExtItem msgExts = 26;
    repeated ConverTag converTags = 27;
    string searchText = 29;
    GrpMemberInfo grpMemberInfo = 30;
    int64 destroyTime = 31;  // 消息默认的销毁时间点，单位毫秒，如 1752551449037，为0时，表示消息不自动销毁
    int64 lifeTimeAfterRead = 32; // 消息已读后生存周期，例如60000，即消息已读1分钟后会被自动删除
    bool isDelete = 33;
    string subChannel = 34;
    repeated string toUserIds = 35;
    int64 readTime = 36;
    FriendInfo friendInfo = 37;
    UserInfo senderInfo = 38;
}
message FriendInfo{
    string friendId = 1;
    bool isFriend = 2;
    string friendDisplayName = 3;
    int64 updatedTime = 4;
}
message GrpMemberInfo{
    string grpDisplayName = 1;
    repeated KvItem extFields = 2;
    int64 updatedTime = 3; 
}
message StreamMsgItem{
  StreamEvent event = 1;
  int64 subSeq = 2;
  bytes partialContent= 3;
}

message StreamDownMsg{
  string targetId = 1;
  ChannelType channelType = 2;
  string msgId = 3;
  repeated StreamMsgItem msgItems = 4;
}

enum StreamEvent{
  DefaultStreamEvent = 0;
  StreamMessage = 1;
  StreamComplete = 2;
}

message MergedMsgs{
    ChannelType channelType = 1;
    string userId = 2;
    string targetId = 3;
    repeated SimpleMsg msgs = 4;
}

message GroupInfo{
    string groupId = 1;
    string groupName = 2;
    string groupPortrait = 3;
    int32 isMute = 4;
    repeated KvItem extFields = 5;
    int64 updatedTime = 6;
}

message KvItem{
    string key = 1;
    string value = 2;
}

message UserIdReq{
    string userId = 1;
}

message UserInfo{
    string userId = 1;
    string nickname = 2;
    string userPortrait = 3;
    repeated KvItem extFields = 4;
    int64 updatedTime = 5;
    repeated KvItem settings = 6;
    repeated KvItem statuses = 7;
    UserType userType = 8;
}
enum UserType{
    User = 0;
    Bot = 1;
}
message SyncConversationsReq{
    int64 startTime = 1;
    int32 count = 2;
}

message QryConversationsReq{
    int64 startTime = 1;
    int32 count = 2;
    int32 order = 3;

    string targetId = 5;
    ChannelType channelType = 6;
    string tag = 7;
    string exceptTag = 8;
}

message QryConversationsResp{
    repeated Conversation conversations = 1;
    bool isFinished = 2;
}
message ClearUnreadReq{
    repeated Conversation conversations = 1;
}
message DelConversationReq{
    repeated Conversation conversations = 1;
}
message ConversationsReq{
    repeated Conversation conversations = 1;
}
message Conversation{
    string userId = 1;
    string targetId = 2;
    ChannelType channelType = 3;
    int64 sortTime = 4;
    int64 unreadCount = 5;
    DownMsg msg = 6;
    int64 latestReadIndex = 7;
    Mentions mentions = 8;
    int32 isTop = 9;
    int64 topUpdatedTime = 10;
    int32 undisturbType = 11;
    UserInfo targetUserInfo = 12;
    GroupInfo groupInfo = 13;
    int64 syncTime = 14;
    int32 isDelete = 15;
    int64 latestUnreadIndex = 16;
    int32 unreadTag = 17;
    string latestReadMsgId = 18;
    int64 latestReadMsgTime = 19;
    repeated ConverTag converTags = 20;
    GrpMemberInfo grpInfo = 21;
    FriendInfo friendInfo = 22;
}

message Mentions{
    bool isMentioned = 1;
    int32 mentionMsgCount = 2;
    repeated UserInfo senders = 3;
    repeated MentionMsg mentionMsgs = 4;
}
message MentionMsg{
    string senderId = 1;
    string msgId = 2;
    int64 msgTime = 3;
    MentionType mentionType = 4;
}

message SyncMsgReq{
    int64 syncTime = 1;//收件箱同步时间
    bool containsSendBox = 2;//是否包含发件箱消息
