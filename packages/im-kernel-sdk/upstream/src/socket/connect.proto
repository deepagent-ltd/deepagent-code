message PushSwitch{
  int32 switch = 1;  //0：关闭；1：开启；
}
message SearchMsgsReq{
  string targetId = 1;
  ChannelType channelType = 2;
  string keyword = 3;
  int32 count = 4;
}
message BatchSearchMsgsResp{
  repeated SearchMsgsResp items = 1;
  double maxScore = 2;
}
message SearchMsgsResp{
  string targetId = 1;
  ChannelType channelType = 2;
  repeated SearchMsgItem items = 3;
  double maxScore = 4;
}
message SearchMsgItem{
  string highlightText = 1;
  DownMsg msg = 2;
  double score = 3;
}
message SubStreamMsgsReq{
    repeated SubStream subStreamMsgs = 1;
}
message SubStream{
    string streamMsgId = 1;
    int64 startSeq = 2;
}
message UserIdsReq{
  repeated string userIds = 1;
}
message UserStatusList{
  repeated UserStatus items = 1;
}

message UserStatus{
  string userId = 1;
  UserOnlineItem onlineStatus = 2;
}

message UserOnlineItem {
  string userId = 1;
  bool isOnline = 2;
}
// DAC receipt-v1, preserving the frozen 9493 wire contract.
message DeliveryReceiptQuery {
 int32 version=1; int32 channelType=2; string targetId=3; string clientUid=4; string requestHash=5; int64 expiresAt=6;
}
message DeliveryReceiptResult {
 string state=1; int32 version=2; string clientUid=3; string requestHash=4; int64 expiresAt=5; string msgId=6; int64 msgTime=7; int64 msgSeqNo=8;
}
message DeliveryCapabilities {
 int32 version=1; string profile=2; int64 maxLifetimeMs=3; int32 maxContentBytes=4; bool eventualDelivery=5;
}
// Protected reader-v1 is independent of receipt-v1. Decimal cursors, revisions,
// IDs and sequences stay strings across JavaScript transports.
message DeliveryReadQuery {
  int32 version = 1;
  string scopeKey = 2;
  string after = 3;
  string pageToken = 4;
  string projectionKey = 5;
  string projectionRevision = 6;
  string direction = 7;
  string anchorDeliveryCursor = 8;
  int32 limit = 9;
  string throughOrdinal = 10;
}
message DeliveryReaderInfo {
  int32 version = 1;
  string scopeKey = 2;
  string currentCursor = 3;
  int64 serverNow = 4;
  int32 maxPageItems = 5;
  int32 maxChangeBytes = 6;
  int32 maxMessageBytes = 7;
  int32 maxWindowPages = 8;
}
message DeliveryConversationChange {
  string projectionKey = 1;
  string revision = 2;
  string cursor = 3;
  string visibility = 4;
  string liveUnread = 5;
  string storedUnread = 6;
  string admittedOrdinal = 7;
  string readOrdinal = 8;
  int64 nextExpiryAt = 9;
  string latestMessageId = 10;
  string latestSequence = 11;
  int64 latestMessageTime = 12;
  int32 conversationType = 13;
  string targetId = 14;
}
message DeliveryChangesResult {
  int32 version = 1;
  string scopeKey = 2;
  string after = 3;
  string upper = 4;
  string scanCursor = 5;
  string scanProjectionKey = 6;
  string pageToken = 7;
  bool windowComplete = 8;
  bool caughtUp = 9;
  int64 serverNow = 10;
  repeated DeliveryConversationChange items = 11;
}
message DeliveryReadMessage {
  string effectKey = 1;
  string messageId = 2;
  string sequence = 3;
  string deliveryCursor = 4;
  int64 messageTime = 5;
  int64 expiresAt = 6;
  string senderId = 7;
  string targetId = 8;
  int32 conversationType = 9;
  string content = 10;
  bool isSend = 11;
  bool isRead = 12;
  // Present only in explicitly negotiated reader-v2 responses.
  string messageType = 13;
}
message DeliveryMessagesResult {
  int32 version = 1;
  string scopeKey = 2;
  string projectionKey = 3;
  string projectionRevision = 4;
  string direction = 5;
  string nextDeliveryCursor = 6;
  bool finished = 7;
  int64 serverNow = 8;
  repeated DeliveryReadMessage items = 9;
}
message DeliveryReadCutResult {
  int32 version = 1;
  string scopeKey = 2;
  string projectionKey = 3;
  string projectionRevision = 4;
  string throughOrdinal = 5;
  string targetAdmittedOrdinal = 6;
  string readOrdinal = 7;
  string liveUnread = 8;
  string storedUnread = 9;
  int64 serverNow = 10;
  bool complete = 11;
}
