[package]
name = "deepagent-work-file-helper"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later AND Apache-2.0"
publish = false

[lib]
name = "native_image_factory"
path = "src/windows_native_bootstrap/lib.rs"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"
rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
ed25519-dalek = "=2.2.0"
windows-sys = { version = "=0.52.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Kernel", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Diagnostics_ToolHelp", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_Security_Cryptography"] }

[[bin]]
name = "deepagent-work-file-helper"
path = "src/main.rs"

[[bin]]
name = "deepagent-work-storage-cleanup"
path = "src/storage_cleanup/main.rs"

[[bin]]
name = "deepagent-work-process-supervisor"
path = "src/command_supervisor/main.rs"

[[bin]]
name = "deepagent-private-storage"
path = "src/private_storage/main.rs"

